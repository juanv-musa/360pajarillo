<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Santuario de El Pajarillo · Experiencia VR Meta Quest</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0A1618">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="./css/vr-360.css?v=1.5.3">

  <!-- A-Frame WebXR Engine (v1.6.0 Local Offline) -->
  <script src="./js/aframe.min.js"></script>

  <!-- Lógica y Base de Datos (Modo Visitante Blindado) -->
  <script src="./js/hotspots-data.js?v=1.5.3"></script>
  <script src="./js/app-360.js?v=1.5.3"></script>
</head>
<body>

  <!-- ==========================================================================
       BARRA SUPERIOR LIMPIA (MODO VISITANTE · SIN CONFIGURACIÓN)
       ========================================================================== -->
  <header class="museum-hud" id="museum-hud">
    <div class="hud-brand">
      <img src="./assets/images/logo-pajarillo-white.png" alt="Santuario de El Pajarillo" class="logo-centro" onerror="this.src='./assets/images/logo-pajarillo-white.svg'">
      <img src="./assets/images/logo-ayuntamiento-huelma-white.png" alt="Ayuntamiento de Huelma" class="logo-ayto" onerror="this.style.display='none'">
      <div class="hud-divider"></div>
      <div class="hud-title-wrap">
        <span class="hud-title">Santuario de El Pajarillo</span>
        <span class="hud-sub" id="hud-current-scene">Cumbre de Pico Mágina · 2.167 m</span>
      </div>
    </div>

    <!-- Pestañas de Selección Directa -->
    <div class="scene-tabs">
      <button class="btn-scene-tab active" data-scene="magina" onclick="window.switchScene('magina')">
        ⛰️ Pico Mágina (360°)
      </button>
      <button class="btn-scene-tab" data-scene="miramundos" onclick="window.switchScene('miramundos')">
        🏔️ Miramundos (360°)
      </button>
      <button class="btn-scene-tab" data-scene="pajarillo" onclick="window.switchScene('pajarillo')">
        🏛️ Santuario El Pajarillo (3D)
      </button>
    </div>

    <div class="hud-actions">
      <button class="btn-hud" onclick="window.exitVRToMenu()">🏠 Inicio</button>
      <button class="btn-hud-vr" onclick="window.enterVRMode()">🥽 Entrar en VR</button>
    </div>
  </header>

  <!-- ==========================================================================
       TARJETA DE INFORMACIÓN INFERIOR (SOLO LECTURA)
       ========================================================================== -->
  <div class="peak-info-card" id="peak-info-card">
    <div class="card-header">
      <span class="card-category">CUMBRE DESTACADA</span>
      <button class="btn-close-card" onclick="window.closePeakCard()">✕</button>
    </div>

    <div style="display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px;">
      <h2 class="card-title" id="card-peak-title" style="margin: 0;">Almadén</h2>
      <span class="card-badge-alt" id="card-peak-elev" style="background:#00C4D6; color:#0A1618; font-weight:bold; padding:2px 10px; border-radius:12px; font-size:0.9rem;">2.077 m</span>
    </div>

    <p class="card-desc" id="card-peak-desc">
      Descripción de la cumbre...
    </p>

    <div class="card-actions">
      <button class="btn-center-peak" onclick="window.lookAtSelectedPeak()">👁️ Centrar Vista en el Pico</button>
    </div>
  </div>

  <!-- CARRUSEL INFERIOR DE CUMBRES -->
  <div class="peak-strip-container" id="peak-strip"></div>

  <!-- ==========================================================================
       PORTADA DE INICIO VISITANTE (LOGOTIPOS + SELECCIÓN DIRECTA DE EXPERIENCIA)
       ========================================================================== -->
  <div class="welcome-overlay" id="welcome-modal">
    <div class="welcome-card welcome-card-visitor">
      <div class="welcome-brand-top">
        <img src="./assets/images/logo-pajarillo-white.png" alt="Santuario de El Pajarillo" class="welcome-logo-pajarillo" onerror="this.src='./assets/images/logo-pajarillo-white.svg'">
        <img src="./assets/images/logo-ayuntamiento-huelma-white.png" alt="Ayuntamiento de Huelma" class="welcome-logo-ayto">
      </div>

      <span class="eyebrow">Centro de Interpretación · Huelma</span>
      <h1>Experiencia Virtual 360° y 3D</h1>
      <p>
        Selecciona el espacio que deseas explorar en Realidad Virtual:
      </p>

      <!-- Selector Directo de las 3 Experiencias (entra directamente en VR) -->
      <div class="visitor-scene-grid">
        <button class="btn-visitor-scene" onclick="window.startVisitorScene('magina')">
          <span class="visitor-scene-icon">⛰️</span>
          <span class="visitor-scene-title">Pico Mágina</span>
          <span class="visitor-scene-sub">Panorámica 360° · 2.167 m</span>
        </button>

        <button class="btn-visitor-scene" onclick="window.startVisitorScene('miramundos')">
          <span class="visitor-scene-icon">🏔️</span>
          <span class="visitor-scene-title">Refugio Miramundos</span>
          <span class="visitor-scene-sub">Panorámica 360° · 2.077 m</span>
        </button>

        <button class="btn-visitor-scene btn-visitor-scene-highlight" onclick="window.startVisitorScene('pajarillo')">
          <span class="visitor-scene-icon">🏛️</span>
          <span class="visitor-scene-title">Santuario El Pajarillo</span>
          <span class="visitor-scene-sub">Esculturas 3D · Siglo IV a.n.e.</span>
        </button>
      </div>

      <!-- Banda de Cofinanciación Institucional Oficial -->
      <div class="welcome-footer-funding">
        <div class="welcome-funding-grid">
          <img src="./assets/images/logos/01-union-europea.png" alt="Cofinanciado por la Unión Europea" class="funding-item" loading="lazy">
          <img src="./assets/images/logos/02-ministerio-hacienda.png" alt="Ministerio de Hacienda - Gobierno de España" class="funding-item" loading="lazy">
          <img src="./assets/images/logos/03-fondos-europeos.png" alt="Fondos Europeos" class="funding-item" loading="lazy">
          <img src="./assets/images/logos/04-junta-andalucia.png" alt="Junta de Andalucía" class="funding-item" loading="lazy">
          <img src="./assets/images/logos/05-ayuntamiento-huelma.png" alt="Ayuntamiento de Huelma" class="funding-item" loading="lazy">
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       WIDGET BRÚJULA (SOLO LECTURA, SIN CALIBRACIÓN)
       ========================================================================== -->
  <div class="viewpoint-compass-widget" id="viewpoint-compass" style="cursor: default;">
    <div class="viewpoint-info">
      <div class="viewpoint-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="#00C4D6">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
      </div>
      <div class="viewpoint-texts">
        <span class="viewpoint-name" id="viewpoint-name">Mágina</span>
        <span class="viewpoint-alt" id="viewpoint-alt">2 165 m</span>
      </div>
    </div>

    <div class="compass-dial-wrap">
      <div class="compass-ring-outer"></div>
      <div class="compass-disc" id="compass-disc">
        <div class="compass-fov-wedge" id="compass-fov-wedge"></div>
        <span class="compass-mark mark-n"><span class="n-arrow">▲</span>N</span>
        <span class="compass-mark mark-e">E</span>
        <span class="compass-mark mark-s">S</span>
        <span class="compass-mark mark-w">W</span>
        <div class="compass-center-heading" id="compass-heading">-101°</div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
       ESCENA 3D WEBXR
       ========================================================================== -->
  <a-scene 
    renderer="antialias: true; colorManagement: true; toneMapping: ACESFilmic; exposure: 0.9; highRefreshRate: true; alpha: true;"
    webxr="referenceSpaceType: local-floor; requiredFeatures: local-floor; optionalFeatures: hit-test;"
    vr-mode-ui="enabled: false"
    loading-screen="dotsColor: #00C4D6; backgroundColor: #050806">

    <a-assets timeout="20000">
      <img id="img-360-magina" src="./assets/images/foto_360_magina.jpg">
      <img id="img-360-miramundos" src="./assets/images/foto_360_miramundos.jpg">
    </a-assets>

    <a-entity id="mouse-cursor" 
              cursor="rayOrigin: mouse" 
              raycaster="objects: .clickable; interval: 50"></a-entity>

    <a-entity id="camera-rig" position="0 1.6 0">
      <a-camera id="head-camera" look-controls="reverseMouseDrag: false" wasd-controls="enabled: true; acceleration: 20">
        <!-- Retícula de mirada VR sutil -->
        <a-entity id="gaze-cursor"
                  cursor="fuse: true; fuseTimeout: 1200"
                  position="0 0 -1.2"
                  geometry="primitive: circle; radius: 0.0035"
                  material="color: #FFFFFF; shader: flat; opacity: 0.85; transparent: true; depthTest: false"
                  raycaster="objects: .clickable"
                  visible="false">
        </a-entity>

        <!-- Indicador de Salida al Menú en VR al mirar al suelo (5 segundos) -->
        <a-entity id="vr-exit-gaze-hud" position="0 -0.32 -0.85" rotation="-15 0 0" visible="false">
          <a-plane width="0.52" height="0.13" color="#0A1618" opacity="0.9" material="shader: flat; transparent: true; depthTest: false"></a-plane>
          <a-text id="vr-exit-gaze-text" value="🏠 Salir al Menú en 5s..." align="center" width="1.2" color="#00C4D6" position="0 0.015 0.01"></a-text>
          <a-ring id="vr-exit-gaze-ring" radius-inner="0.016" radius-outer="0.024" color="#00C4D6" position="0 -0.035 0.01" theta-length="0" material="shader: flat; depthTest: false"></a-ring>
        </a-entity>
      </a-camera>

      <!-- Punteros láser para Meta Quest (Touch Plus Controllers) -->
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #00C4D6; lineOpacity: 0.8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #00C4D6; lineOpacity: 0.8"></a-entity>
    </a-entity>

    <!-- Anillo Guardián y Brújula de Suelo VR AMPLIADO (6m x 6m) -->
    <a-entity id="vr-floor-compass-rig" position="0 0.02 0" rotation="0 0 0">
      <a-plane id="vr-floor-compass"
               rotation="-90 0 0"
               width="6.0"
               height="6.0"
               material="transparent: true; shader: flat; side: double; depthTest: true; opacity: 0.9"></a-plane>
    </a-entity>

    <!-- Contenedor 3D del Santuario de El Pajarillo (peanas gris oscuro, centrado para rodearlo 360°) -->
    <a-entity id="scene-3d-rig" position="0 0 0" visible="false">
      <a-entity id="pajarillo-3d-model" 
                gltf-model="./assets/models/santuario_pajarillo_vr.glb?v=4" 
                position="0 0 -2.2" 
                rotation="0 0 0" 
                scale="1 1 1"
                visible="false"></a-entity>

      <!-- Luces de museo 360° equilibradas -->
      <a-light id="sun-light-3d" type="directional" color="#FFF6E8" intensity="0.55" position="2 6 4"></a-light>
      <a-light id="fill-light-3d" type="directional" color="#EEF4FF" intensity="0.25" position="-3 3 2"></a-light>
      <a-light id="back-light-3d" type="directional" color="#FFF3E0" intensity="0.45" position="-1 5 -6"></a-light>
      <a-light id="hemi-light-3d" type="hemisphere" color="#FFF9F0" groundColor="#5A4B3E" intensity="0.20"></a-light>
    </a-entity>

    <a-sky id="sky-360" 
           src="#img-360-magina" 
           rotation="0 0 0" 
           radius="30"
           material="shader: flat; side: back; transparent: false; opacity: 1"></a-sky>

    <a-entity id="hotspots-container" position="0 1.6 0"></a-entity>

    <a-sphere id="fade-overlay" radius="0.3" position="0 1.6 0"
              material="color: #000000; shader: flat; opacity: 0; side: back; transparent: true"></a-sphere>

    <a-light type="ambient" color="#FFFFFF" intensity="0.35"></a-light>
  </a-scene>

</body>
</html>
